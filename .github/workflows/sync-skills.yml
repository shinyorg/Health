name: Sync Skills to Skills Repository

on:
  push:
    branches:
      - 'v*'
    paths:
      - 'skills/**'
  workflow_dispatch:

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    # Only ever sync from branches starting with "v" (covers manual workflow_dispatch too,
    # which is not constrained by the push branch filter above).
    if: startsWith(github.ref_name, 'v')

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          path: source

      - name: Checkout skills repository
        uses: actions/checkout@v7
        with:
          repository: shinyorg/skills
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-repo

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync skills directory
        run: |
          # Skills repo is a multi-plugin marketplace:
          #   plugins/<plugin>/skills/<skill>/
          # The shiny-health skill belongs to the shiny-client plugin.
          SRC="source/skills/shiny-health"
          DEST="skills-repo/plugins/shiny-client/skills"

          if [ ! -d "$SRC" ]; then
            echo "::error::Source skill directory '$SRC' not found"
            exit 1
          fi

          # Remove the existing skill directory to ensure a clean sync (handles
          # renamed/removed reference files), then copy the whole skill folder.
          rm -rf "$DEST/shiny-health"
          mkdir -p "$DEST"
          cp -r "$SRC" "$DEST/"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-repo
          commit-message: "Update shiny-health skill from Shiny Health repository"
          title: "Update shiny-health skill"
          body: |
            This PR updates the shiny-health skill from the [Shiny Health repository](https://github.com/shinyorg/health).

            **Source commit:** ${{ github.sha }}
            **Triggered by:** @${{ github.actor }}
            ---
            *This PR was automatically created by the [sync-skills workflow](https://github.com/shinyorg/health/actions/workflows/sync-skills.yml).*
          branch: update-shiny-health-skill
          delete-branch: true
          labels: |
            automated
            skills-update
